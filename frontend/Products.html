<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="Darkmode.js"></script>
    <script src="Api.js"></script>
    <script src="Products.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
    }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn {
                @apply px-6 py-3 rounded-full dark:text-white font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 shadow-lg;
            }

            .zoom {
                @apply transition-all duration-300 ease-out hover:scale-110 hover:shadow-2xl hover:from-purple-700 hover:to-indigo-700;
            }
        }
    </style>
</head>

<body class="text-[#333333] font-[Candara] bg-gray-100 dark:bg-gray-900 dark:text-gray-200 transition-colors">
    <header class="w-full border-b border-gray-300 bg-white dark:bg-gray-800 dark:border-gray-700">
        <nav class="max-w-7xl mx-auto flex items-center justify-between py-2 px-6 gap-10">
            <div>
                <img src="/Images/logo.png" alt="Logo VT" class="w-[3em]">
            </div>

            <div class="relative w-1/3 md-block">
                <input id="searchInput" type="text" placeholder="Search a product" 
                class="w-full pl-10 pr-4 py-2 rounded-full border border-gray-300 dark:border-white-300 focus:ring-2 focus:ring-purple-500 outline-none">
                <button id="searchButton" class="w-5 h-5 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2">
                <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <ul class="hidden md:flex space-x-8 text-lg dark:text-white font-bold">
                <li><a href="Home.html" class="hover:text-purple-600">Home</a></li>
                <li><a href="Products.html" class="hover:text-purple-600">Products</a></li>
                <li><a href="Service.html" class="hover:text-purple-600">Services</a></li>
                <li><a href="Contact.html" class="hover:text-purple-600">Contact</a></li>
            </ul>
            <!-- icons -->
            <div class="flex gap-10">
                <a href="Cart.html"><i class="fa-solid fa-cart-shopping text-2xl hover:text-purple-600 zoom"></i></a>
                <a href="Account.html"><i class="fa-solid fa-circle-user text-2xl hover:text-purple-600 zoom"></i></a>
            </div>
            <button id="themeToggle" class="text-xl px-3">🌓︎</button>
        </nav>
    </header>

    <section class="px-6 py-10 bg-[#F5F7FA] dark:bg-gray-900">
        <!-- top banner -->
        <div class="hidden md:block lg:bg-white dark:bg-gray-800 dark:bg-gray-800 rounded shadow-sm p-16 hover:shadow-lg transition">
            <div class="flex">
                    <!-- left -->
                    <div class="grid grow">
                        <h3 class="dark:text-white font-bold my-auto text-4xl text-shadow-lg">Stay Ahead With Latest <br> Accessories</h3>
                    </div>
                    <!-- right -->
                    <div>
                        <div class="absolute w-[300px] h-[300px] rounded-full bg-black dark:bg-white blur-3xl opacity-10 right"></div>
                        <img src="Images/Products/PC.png" class="mx-20 h-60"/>
                    </div>
            </div>
            <button class="relative w-fit px-5 py-2 rounded-full text-white text-lg font-semibold btn zoom">Buy Now ></button>
        </div>

        <p id="productStatus" class="my-6 text-center text-lg hidden"></p>

        <!-- filled from the Catalog API by Products.js -->
        <div id="productGrid" class="my-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6"></div>
    </section>

    <footer class="border-t border-gray-200 dark:bg-gray-800 dark:border-gray-800 py-6">
        <div class="w-full mx-auto px-6 flex flex-col items-center justify-between space-y-4 md:space-y-0">
            <div>
                <img src="/Images/logo.png" alt="Logo VT" class="w-20">
            </div>
                <ul class="flex flex-cols dark:text-white font-bold text-lg lg:text-3xl py-4 gap-4 lg:gap-10 justify-center flex-wrap">
                    <li>MAIN</li>
                    <li>PRODUCTS</li>
                    <li>BLOG</li>
                    <li>SHOP</li>
                    <li>CONTACTS</li>
                </ul>
            <div class="w-full h-px bg-gray-400 my-4"></div>

            <div class="flex items-center space-x-4 text-lg"><span>© 2025 VTStore</span></div>

            <div class="flex space-x-4 text-sm text-gray-600 dark:text-white">
                <a href="#" class="hover:text-purple-600">Privacy Policy</a><span>|</span>
                <a href="#" class="hover:text-purple-600">Terms of Service</a><span>|</span>
                <a href="#" class="hover:text-purple-600">FAQ</a><span>|</span>
                <a href="#" class="hover:text-purple-600">Support</a>
            </div>
        </div>
    </footer>

</body>
</html>

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Build output names carry a content hash, so they can be cached for good.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /Images/ {
        try_files $uri =404;
        expires 7d;
    }

    # Single-page app: every other path is handled by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
